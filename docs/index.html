<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EventBook - Enterprise Event Scheduling, Ticketing, and Attendance Management Platform" />
  <title>EventBook - Event Scheduling & Attendance Platform</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Supabase Official SDK (Provides window.supabase for supabaseClient.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Correct Root Stylesheet -->
  <link rel="stylesheet" href="style.css?v=36" />

  <style>
    :root {
      --nav-height: 64px;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main, #f8fafc);
      color: var(--text-primary, #0f172a);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-header {
      height: var(--nav-height);
      background: #ffffff;
      border-bottom: 1px solid var(--border-color, #e2e8f0);
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
    }

    .header-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary, #2563eb);
      letter-spacing: -0.5px;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted, #64748b);
      text-decoration: none;
      transition: all 0.15s ease-in-out;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--primary, #2563eb);
      background: #eff6ff;
    }

    .nav-link-admin {
      color: #334155;
      font-weight: 700;
    }

    .nav-link-admin:hover, .nav-link-admin.active {
      color: #1e293b;
      background: #f1f5f9;
    }

    .btn-create-event {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.15rem;
      border-radius: 9999px;
      background: var(--primary, #2563eb);
      color: #ffffff !important;
      font-size: 0.875rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
      transition: background 0.15s ease;
      margin-left: 0.5rem;
    }

    .btn-create-event:hover {
      background: #1d4ed8 !important;
      color: #ffffff !important;
    }

    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      z-index: 1000;
      justify-content: space-around;
      align-items: center;
      padding: 0 0.5rem;
    }

    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 600;
      flex: 1;
      padding: 4px 0;
    }

    .mobile-nav-item svg {
      width: 20px;
      height: 20px;
    }

    .mobile-nav-item.active, .mobile-nav-item:hover {
      color: var(--primary, #2563eb);
    }

    #app {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem 1.25rem;
      box-sizing: border-box;
    }

    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      min-width: 280px;
      max-width: 400px;
      padding: 0.85rem 1.15rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: toastIn 0.2s ease-out;
    }

    .toast-success { background: #10b981; color: #ffffff; }
    .toast-danger { background: #ef4444; color: #ffffff; }
    .toast-warning { background: #f59e0b; color: #ffffff; }
    .toast-info { background: #3b82f6; color: #ffffff; }

    @keyframes toastIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 768px) {
      .main-nav { display: none; }
      .mobile-bottom-nav { display: flex; }
      #app { padding-bottom: 5.5rem; }
      #toast-container { bottom: 4.5rem; left: 1rem; right: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Top Main Navigation Bar -->
  <header class="main-header">
    <div class="header-container">
      
      <!-- Brand Logo -->
      <a href="#/dashboard" class="brand-logo" title="EventBook Home">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>EventBook</span>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="main-nav" aria-label="Main Navigation">
        <a href="#/dashboard" class="nav-link" id="nav-dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Dashboard</span>
        </a>

        <a href="#/events" class="nav-link" id="nav-events">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>My Events</span>
        </a>

        <a href="#/analytics" class="nav-link" id="nav-analytics">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span>Analytics</span>
        </a>

        <!-- Global Enterprise Admin Console Link -->
        <a href="#/admin" class="nav-link nav-link-admin" id="nav-admin" title="Global Super Admin Console">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>Admin</span>
        </a>

        <!-- Create Event Button -->
        <a href="#/create" class="btn-create-event" id="nav-create">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Create Event</span>
        </a>
      </nav>

    </div>
  </header>

  <!-- SPA View Injection Mount Point -->
  <main id="app" role="main">
    <div class="loader-center" style="display:flex; justify-content:center; align-items:center; min-height:50vh;">
      <div class="spinner" style="width:40px; height:40px; border:4px solid #e2e8f0; border-top-color:#2563eb; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
    <a href="#/dashboard" class="mobile-nav-item" id="mob-nav-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>Home</span>
    </a>

    <a href="#/events" class="mobile-nav-item" id="mob-nav-events">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span>Events</span>
    </a>

    <a href="#/create" class="mobile-nav-item" id="mob-nav-create">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
      <span>Create</span>
    </a>

    <a href="#/admin" class="mobile-nav-item" id="mob-nav-admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>Admin</span>
    </a>
  </nav>

  <!-- Notification Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Active Route Highlighter Script -->
  <script>
    function updateActiveNav() {
      const hash = window.location.hash || '#/';
      document.querySelectorAll('.nav-link, .mobile-nav-item').forEach(el => {
        const href = el.getAttribute('href');
        if (href && hash.startsWith(href)) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
    }
    window.addEventListener('hashchange', updateActiveNav);
    window.addEventListener('DOMContentLoaded', updateActiveNav);
  </script>

  <!-- Production App Loader with Version Cache-Busting -->
  <script type="module" src="js/app.js?v=36"></script>

</body>
</html>
