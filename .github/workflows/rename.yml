name: Rename Public to Docs

on:
  workflow_dispatch: # Allows you to manually trigger it with a click

permissions:
  contents: write

jobs:
  rename-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Rename Folder and Fix File Paths
        run: |
          # 1. Rename public to docs
          if [ -d "public" ]; then
            git mv public docs
          else
            echo "Directory 'public' not found or already renamed."
          fi

          # 2. Update absolute asset paths to relative paths for GitHub Pages
          if [ -f "docs/index.html" ]; then
            sed -i 's|href="/css/styles.css"|href="./css/styles.css"|g' docs/index.html
            sed -i 's|src="/js/app.js"|src="./js/app.js"|g' docs/index.html
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
          else
            git commit -m "Auto-rename public to docs and update relative asset paths"
            git push origin main
          fi
